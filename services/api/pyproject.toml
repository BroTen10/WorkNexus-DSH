[project]
name = "worknexus-dsh-control-plane"
version = "0.1.0"
description = "WorkNexus-DSH 企业控制面（FastAPI + PostgreSQL 17 + Alembic）"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn==0.37.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "email-validator==2.3.0",
  "psycopg[binary]==3.2.10",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
